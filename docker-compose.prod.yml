x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-security: &default-security
  security_opt:
    - no-new-privileges:true

services:
  caddy:
    image: caddy:2-alpine
    container_name: rentflow-caddy
    restart: unless-stopped
    <<: *default-security
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    logging: *default-logging
    mem_limit: 128m
    cpus: 0.25

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://backend:3001
    container_name: rentflow-frontend
    restart: unless-stopped
    init: true
    <<: *default-security
    cap_drop:
      - ALL
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_URL: http://backend:3001
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging
    mem_limit: 256m
    cpus: 0.5

  backend:
    build: ./backend
    container_name: rentflow-backend
    restart: unless-stopped
    init: true
    <<: *default-security
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ocr-service:
        condition: service_healthy
    env_file:
      - ./backend/.env.production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # ports ถูกลบออกโดยตั้งใจ — เข้าถึงได้ผ่าน Caddy เท่านั้น
    logging: *default-logging
    mem_limit: 512m
    cpus: 1.0

  ocr-service:
    build:
      context: ./ocr-service
    container_name: ocr-server
    restart: unless-stopped
    init: true
    <<: *default-security
    cap_drop:
      - ALL
    environment:
      OCR_POOL_SIZE: ${OCR_POOL_SIZE:-3}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:8899/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    mem_limit: 2g
    cpus: 1.5

  postgres:
    image: postgres:16
    container_name: rentflow-postgres
    restart: unless-stopped
    <<: *default-security
    env_file:
      - ./backend/.env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    mem_limit: 1g
    cpus: 1.0

  redis:
    image: redis:7-alpine
    container_name: rentflow-redis
    restart: unless-stopped
    <<: *default-security
    command: redis-server --save 60 1 --loglevel warning
    environment:
      TZ: Asia/Bangkok
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    mem_limit: 256m
    cpus: 0.5

  worker:
    build: ./backend
    container_name: rentflow-worker
    command: npm run start:worker
    restart: unless-stopped
    init: true
    <<: *default-security
    cap_drop:
      - ALL
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ocr-service:
        condition: service_healthy
    env_file:
      - ./backend/.env.production
    # ไม่มี HTTP surface ให้เช็ค — อาศัย process liveness ของ Docker (restart: unless-stopped) แทน
    logging: *default-logging
    mem_limit: 512m
    cpus: 0.5

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
