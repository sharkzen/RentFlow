version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: rentflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rentflow
      POSTGRES_USER: rentflow
      POSTGRES_PASSWORD: rentflow
      TZ: Asia/Bangkok
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rentflow-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@rentflow.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      TZ: Asia/Bangkok
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  redis:
    image: redis:7
    container_name: rentflow-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning # สั่งให้ Redis เซฟข้อมูลลงดิสก์
    environment:
      TZ: Asia/Bangkok # เพิ่ม TZ
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data # เพิ่ม Volume ป้องกัน Job Queue หาย

  worker:
    build: ./backend
    container_name: rentflow-worker
    command: npm run start:worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TZ: Asia/Bangkok

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
