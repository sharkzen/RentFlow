services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: rentflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_URL: http://backend:3001
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: rentflow-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://rentflow:rentflow@postgres:5432/rentflow
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OCR_SERVICE_URL: http://ocr-service:8899
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  ocr-service:
    build:
      context: ./ocr-service
    container_name: ocr-server
    ports:
      - "8899:8899"
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: rentflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rentflow
      POSTGRES_USER: rentflow
      POSTGRES_PASSWORD: rentflow
      TZ: Asia/Bangkok
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: rentflow-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    environment:
      TZ: Asia/Bangkok
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: rentflow-worker
    command: npm run dev:worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://rentflow:rentflow@postgres:5432/rentflow
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OCR_SERVICE_URL: http://ocr-service:8899
      TZ: Asia/Bangkok
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

volumes:
  postgres_data:
  redis_data:
  backend_node_modules:
  frontend_node_modules:
  frontend_next:
